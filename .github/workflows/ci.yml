name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Java 21, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The pom lives in Code/, not at the repo root.
      # `package` compiles every source file and builds the shaded jar, so it
      # proves the project resolves and builds from nothing but the repo.
      # Once there are tests under Code/src/test, switch this to `verify`
      # and the same job starts failing on a broken test.
      - name: Build and package
        working-directory: Code
        run: mvn -B package
